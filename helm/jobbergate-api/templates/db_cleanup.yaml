{{- if .Values.autoClean.enable -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: jg-db-cleanup
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    k8s-app: jobbergate
spec:
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            k8s-app: jobbergate
          annotations:
            instrumentation.opentelemetry.io/inject-python: "false"
        spec:
          containers:
            - name: job
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              resources:
                requests:
                  memory: 1Gi
                limits:
                  memory: 5Gi
              command:
                - sh
                - -c
                {{- if .Values.multiTenancy.enabled }}
                - |-
                  # Multi-tenancy: one database per organization, named after the organization id (UUID).
                  ORGS=$(python - <<'PY'
                  import os
                  from sqlalchemy import create_engine, text
                  query = text("SELECT datname FROM pg_database WHERE datname ~ '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'")
                  with create_engine(os.environ["DATABASE_URL"] + "/postgres").connect() as conn:
                      print(" ".join(f"--organization_id={row[0]}" for row in conn.execute(query)))
                  PY
                  )
                  if [ -z "$ORGS" ]; then echo "No tenant databases found"; exit 0; fi
                  exec jg-api-cron $ORGS
                {{- else }}
                - exec jg-api-cron
                {{- end }}
              envFrom:
                - configMapRef:
                    name: jobbergate-api
                    optional: false
              env:
                {{- include "jobbergate-api.dbEnv" . | nindent 16 }}
                {{- include "jobbergate-api.s3Env" . | nindent 16 }}
                - name: DATABASE_HOST
                  value: jobbergate-postgres
                - name: DATABASE_URL
                  value: postgresql://$(DATABASE_USER):$(DATABASE_PSWD)@$(DATABASE_HOST):$(DATABASE_PORT)
                - name: AUTO_CLEAN_JOB_SCRIPT_TEMPLATES_DAYS_TO_ARCHIVE
                  value: {{ .Values.autoClean.templatesDaysToArchive | quote }}
                - name: AUTO_CLEAN_JOB_SCRIPT_TEMPLATES_DAYS_TO_DELETE
                  value: {{ .Values.autoClean.templatesDaysToDelete | quote }}
                - name: AUTO_CLEAN_JOB_SCRIPTS_DAYS_TO_ARCHIVE
                  value: {{ .Values.autoClean.jobScriptsDaysToArchive | quote }}
                - name: AUTO_CLEAN_JOB_SCRIPTS_DAYS_TO_DELETE
                  value: {{ .Values.autoClean.jobScriptsDaysToDelete | quote }}
                - name: AUTO_CLEAN_JOB_SUBMISSIONS_DAYS_TO_ARCHIVE
                  value: {{ .Values.autoClean.jobbergateApiDaysToArchive | quote }}
                - name: AUTO_CLEAN_JOB_SUBMISSIONS_DAYS_TO_DELETE
                  value: {{ .Values.autoClean.jobbergateApiDaysToDelete | quote }}
          restartPolicy: OnFailure
{{- end }}
