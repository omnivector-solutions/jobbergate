apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobbergate-api
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    k8s-app: jobbergate
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: jobbergate-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jobbergate-api
      annotations:
        instrumentation.opentelemetry.io/inject-python: "default/python-instrumentation"
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: check-migration
          configMap:
            name: check-migration
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: pgchecker
          command:
            - sh
            - -c
            - |-
              echo ">>>>> Waiting for Postgres to be ready"
              until nc -z -w 2 $HOST 5432; do sleep 2; done;
              echo "<<<<< Postgres ready"
          image: {{ .Values.pgCheckerImage }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            limits:
              cpu: 10m
              memory: 16Mi
            requests:
              cpu: 10m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HOST
              value: {{ include "jobbergate.dbHost" . }}
        - name: migration
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - sh
            - -c
            - cd /app && python check-migration.py
          envFrom:
            - configMapRef:
                name: jobbergate-api
                optional: false
          env:
            {{- include "jobbergate-api.dbEnv" . | nindent 12 }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- include "jobbergate-api.s3Env" . | nindent 12 }}
            {{- if .Values.rabbitmq.enabled }}
            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.usernameKey }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.rabbitmq.existingSecret }}
                  key: {{ .Values.rabbitmq.passwordKey }}
            {{- end }}
            - name: DATABASE_URL
              value: postgresql://$(DATABASE_USER):$(DATABASE_PSWD)@$(DATABASE_HOST):$(DATABASE_PORT)
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - name: check-migration
              mountPath: /app/check-migration.py
              subPath: check-migration.py
      containers:
        - name: jobbergate-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jobbergate-api
                optional: false
          readinessProbe:
            httpGet:
              port: 80
              path: /jobbergate/health
            periodSeconds: 3
            failureThreshold: 3
            successThreshold: 2
            timeoutSeconds: 1
            initialDelaySeconds: 5
          startupProbe:
            tcpSocket:
              port: 80
          env:
            {{- include "jobbergate-api.dbEnv" . | nindent 12 }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- include "jobbergate-api.s3Env" . | nindent 12 }}
            {{- if .Values.rabbitmq.enabled }}
            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host }}
            - name: RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.rabbitmq.usernameKey }}
                  name: {{ .Values.rabbitmq.existingSecret }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: {{ .Values.rabbitmq.passwordKey }}
                  name: {{ .Values.rabbitmq.existingSecret }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
      restartPolicy: Always
