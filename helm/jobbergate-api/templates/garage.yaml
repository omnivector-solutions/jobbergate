{{- if eq .Values.storage.backend "garage" }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jobbergate-garage-pvc
  finalizers:
    - kubernetes.io/pvc-protection
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    k8s-app: jobbergate
spec:
  accessModes:
    - ReadWriteOnce
  {{- with .Values.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.garage.storageSize }}
---
# Garage requires the S3 key id, S3 secret and RPC secret to be generated by
# us. The RPC secret must be 32 bytes of hex, so it is generated as 64 digits.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: jobbergate-garage-access-key
  labels:
    k8s-app: jobbergate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 20
  digits: 5
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: jobbergate-garage-secret-key
  labels:
    k8s-app: jobbergate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: jobbergate-garage-rpc-secret
  labels:
    k8s-app: jobbergate
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  length: 64
  digits: 64
  symbols: 0
  noUpper: true
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jobbergate-garage-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    k8s-app: jobbergate
spec:
  refreshInterval: "0"
  refreshPolicy: CreatedOnce
  secretStoreRef:
    name: {{ .Values.externalSecrets.clusterSecretStoreName }}
    kind: ClusterSecretStore
  target:
    name: jobbergate-garage-credentials
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: "jobbergate-garage-access-key"
      rewrite:
        - regexp:
            source: "(.*)"
            target: "GARAGE_DEFAULT_ACCESS_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: "jobbergate-garage-secret-key"
      rewrite:
        - regexp:
            source: "(.*)"
            target: "GARAGE_DEFAULT_SECRET_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: "jobbergate-garage-rpc-secret"
      rewrite:
        - regexp:
            source: "(.*)"
            target: "GARAGE_RPC_SECRET"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jobbergate-garage-config
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    k8s-app: jobbergate
data:
  garage.toml: |
    {{- include "jobbergate-api.garageConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobbergate-garage
  labels:
    k8s-app: jobbergate
    app: garage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  selector:
    matchLabels:
      app: jobbergate-garage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jobbergate-garage
      annotations:
        checksum/config: {{ include "jobbergate-api.garageConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: config
          configMap:
            name: jobbergate-garage-config
        - name: storage
          persistentVolumeClaim:
            claimName: jobbergate-garage-pvc
      containers:
        - name: garage
          image: "{{ .Values.storage.garage.image.repository }}:{{ .Values.storage.garage.image.tag }}"
          # --single-node and --default-bucket make Garage bootstrap its own layout,
          # the S3 key (GARAGE_DEFAULT_ACCESS_KEY/SECRET_KEY) and the bucket
          # (GARAGE_DEFAULT_BUCKET), so no init job is needed.
          command:
            - /garage
            - server
            - --single-node
            - --default-bucket
          envFrom:
            - secretRef:
                name: jobbergate-garage-credentials
                optional: false
          env:
            - name: GARAGE_DEFAULT_BUCKET
              value: {{ .Values.storage.bucketName | quote }}
          ports:
            - name: s3
              containerPort: 3900
          readinessProbe:
            exec:
              command:
                - /garage
                - bucket
                - info
                - {{ .Values.storage.bucketName | quote }}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: storage
              mountPath: /var/lib/garage
          resources:
            {{- toYaml .Values.storage.garage.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: jobbergate-garage
  labels:
    k8s-app: jobbergate
    app: garage
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 3900
      targetPort: s3
      protocol: TCP
  selector:
    app: jobbergate-garage
{{- end }}
