name: Publish jobbergate-api Helm Chart to GHCR

# This action:
#   - Is triggered when a chart-specific tag is pushed (jobbergate-api-chart-v<Chart.yaml version>)
#     or manually via workflow_dispatch;
#   - Checks that helm/jobbergate-api/Chart.yaml's version matches the tag;
#   - Packages the chart and pushes it as an OCI artifact to GHCR;
#   - Attaches the packaged chart to a GitHub Release.

on:
  push:
    tags:
      - "jobbergate-api-chart-v*"
    paths:
      - "helm/jobbergate-api/**"
      - ".github/workflows/publish_jobbergate_api_helm_chart.yaml"
  workflow_dispatch:

jobs:
  publish-helm-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.15.3

      - id: chart-version
        name: Get chart version from Chart.yaml
        working-directory: helm/jobbergate-api
        run: |
          echo "version=$(grep '^version:' Chart.yaml | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Fail if chart version doesn't match the tag
        if: ${{ github.ref_type == 'tag' && github.ref_name != format('jobbergate-api-chart-v{0}', steps.chart-version.outputs.version) }}
        run: |
          echo "Chart.yaml version doesn't match tag!"
          echo "tag=${{ github.ref_name }}, expected=jobbergate-api-chart-v${{ steps.chart-version.outputs.version }}"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        working-directory: helm/jobbergate-api
        run: helm package .

      - name: Publish Helm chart to GHCR
        working-directory: helm/jobbergate-api
        run: |
          CHART_PACKAGE=$(ls -- *.tgz)
          helm push "$CHART_PACKAGE" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Attach chart package to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: helm/jobbergate-api/*.tgz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
